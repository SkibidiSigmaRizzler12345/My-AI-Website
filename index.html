<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Website</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; text-align: center; }
    textarea { width: 100%; height: 100px; margin-bottom: 10px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    #output { margin-top: 20px; padding: 15px; border: 1px solid #ccc; min-height: 50px; background: #f9f9f9; }
  </style>
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>

  <h1>Ask My AI Assistant!</h1>
  <textarea id="userInput" placeholder="Ask me anything..."></textarea><br>
  <button onclick="askAI()">Ask AI</button>

  <h3>Answer:</h3>
  <div id="output">Your AI answer will appear here...</div>

  <script>
    async function askAI() {
      const prompt = document.getElementById('userInput').value;
      const output = document.getElementById('output');
      
      output.innerText = "Thinking...";
      
      try {
        // Calling AI capability right from your frontend!
        let response = await puter.ai.chat(prompt);
        output.innerText = response;
      } catch (error) {
        output.innerText = "Error: Something went wrong!";
      }
    }
  </script>

</body>
</html>
