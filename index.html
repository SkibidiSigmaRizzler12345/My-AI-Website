<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Peer Chat</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; background-color: #f4f7f6; }
    .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ddd; }
    #chat-box { height: 250px; overflow-y: scroll; border: 1px solid #eee; padding: 10px; background: #fafafa; margin-bottom: 10px; }
    .msg { margin-bottom: 8px; padding: 6px 10px; border-radius: 4px; max-width: 80%; }
    .me { background: #007bff; color: white; margin-left: auto; width: fit-content; }
    .peer { background: #e9ecef; color: #333; width: fit-content; }
    input[type="text"] { padding: 8px; width: 65%; margin-right: 5px; }
    button { padding: 8px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #status { font-weight: bold; color: #555; }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

  <h2>🌐 Real-Time Device-to-Device Chat</h2>

  <div class="card">
    <p><strong>Your Unique ID:</strong> <span id="my-id">Generating...</span></p>
    <p id="status">Status: Waiting for connection...</p>
    
    <div>
      <input type="text" id="peer-id-input" placeholder="Paste friend's ID here...">
      <button onclick="connectToPeer()">Connect</button>
    </div>
  </div>

  <div class="card">
    <div id="chat-box"></div>
    <input type="text" id="messageInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    // 1. Create a peer connection with a random ID
    const peer = new Peer();
    let conn = null;

    const myIdEl = document.getElementById('my-id');
    const statusEl = document.getElementById('status');
    const chatBox = document.getElementById('chat-box');

    // Display your generated ID when connected to the network
    peer.on('open', (id) => {
      myIdEl.innerText = id;
    });

    // 2. LISTEN FOR INCOMING CONNECTIONS (If someone connects to YOU)
    peer.on('connection', (incomingConn) => {
      conn = incomingConn;
      setupConnection();
    });

    // 3. INITIATE CONNECTION (If YOU connect to someone else)
    function connectToPeer() {
      const peerId = document.getElementById('peer-id-input').value.trim();
      if (!peerId) return alert('Please enter a Peer ID');
      
      conn = peer.connect(peerId);
      setupConnection();
    }

    // Set up message event listeners once connected
    function setupConnection() {
      conn.on('open', () => {
        statusEl.innerText = 'Status: Connected! You can now chat live.';
        statusEl.style.color = 'green';
      });

      // Handle receiving live messages
      conn.on('data', (data) => {
        appendMessage(data, 'peer');
      });

      conn.on('close', () => {
        statusEl.innerText = 'Status: Disconnected.';
        statusEl.style.color = 'red';
      });
    }

    // Send message to connected device
    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();

      if (!text) return;
      if (!conn || !conn.open) {
        alert('You are not connected to anyone yet!');
        return;
      }

      // Send data through WebRTC stream
      conn.send(text);
      appendMessage(text, 'me');
      input.value = '';
    }

    function appendMessage(msg, type) {
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerText = msg;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
